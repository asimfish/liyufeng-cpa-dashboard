<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Codex CPA · 小时状态</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--card:#111f33;--line:#263a55;--muted:#99acc5;--text:#edf5ff;--green:#26d69a;--red:#ff647c;--amber:#f6bd57;--blue:#8bb9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#162b49 0,#08111f 42%);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1320px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.title{font-size:30px;font-weight:800;margin:4px 0}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{width:340px;max-width:70vw;background:#0d192a;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px}.toolbar button{background:#2464c3;border:0;border-radius:9px;color:white;padding:10px 14px;cursor:pointer}.toolbar button.alt{background:#1a2a41}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat,.account{background:rgba(17,31,51,.92);border:1px solid var(--line);border-radius:14px}.stat{padding:15px}.stat strong{display:block;font-size:25px;margin-top:4px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:16px}.account{padding:18px}.account-head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}.account-name{font-size:20px;font-weight:750}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}.green{background:rgba(38,214,154,.16);color:var(--green)}.red{background:rgba(255,100,124,.16);color:var(--red)}.amber{background:rgba(246,189,87,.16);color:var(--amber)}.gray{background:#223149;color:#bfccdc}.rows{display:grid;gap:7px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed #20334d;padding:5px 0}.row span{color:var(--muted)}.section{margin-top:15px}.section-title{font-weight:700;margin-bottom:7px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#172941;border:1px solid #2b4463;border-radius:8px;padding:5px 8px;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;border-bottom:1px solid #20334d;padding:7px 5px;vertical-align:top}.table th{color:var(--muted);font-weight:600}.table code{color:#b9d2ff}.error{color:var(--red);min-height:24px;margin:12px 0}.notice{border:1px solid #354c6c;background:#101e31;border-radius:12px;padding:12px;margin:14px 0;color:#c2d0e3}.empty{color:var(--muted);font-size:13px}.countdown{font-variant-numeric:tabular-nums;color:var(--blue)}@media(max-width:850px){main{padding:20px 12px}.stats{grid-template-columns:repeat(2,1fr)}.stats .clock{grid-column:span 2}.cards{grid-template-columns:1fr}.toolbar input{width:100%;max-width:100%}header{display:block}.toolbar{margin-top:14px}}

/* BEGIN PASSIVE PERFORMANCE PANEL */
.performance-panel{margin:24px 0;padding:22px;border:1px solid #395571;border-radius:18px;background:linear-gradient(145deg,#15263bf0,#0e1a2af0);color:#e7f0fc}.perf-heading{display:flex;justify-content:space-between;align-items:center;gap:16px}.perf-kicker{font-size:10px;letter-spacing:.18em;color:#8ebaff}.perf-heading h2{font-size:21px;margin:4px 0 14px;letter-spacing:-.02em}.perf-heading>span{font-size:11px;color:#9eb1ca}.perf-alert{border-left:3px solid #64dac0;padding:8px 12px;background:#64dac00b;font-size:12px;margin-bottom:16px}.perf-alert small{display:block;color:#9eb1ca;margin-top:4px}.perf-warning{border-color:#ffc267;background:#ffc2670b;color:#ffda97}.perf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.perf-card{min-width:0;padding:14px 15px;background:#0b16257a;border:1px solid #30445c;border-radius:12px}.perf-card>span{display:block;color:#a2b5ce;font-size:12px}.perf-card strong{display:block;font-size:27px;font-variant-numeric:tabular-nums;font-weight:650;margin:7px 0}.perf-card small{display:block;color:#9eb1ca;font-size:10px;line-height:1.8}.perf-card em{font-style:normal;font-size:12px}.perf-graph{width:100%;height:44px;display:block;margin-top:8px}.perf-table-wrap{overflow-x:auto;margin-top:18px}.perf-table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}.perf-table th,.perf-table td{padding:10px 12px;text-align:left;border-bottom:1px solid #ffffff0d}.perf-table th{color:#9eb1ca;font-weight:500}.perf-table small{display:block;font-size:10px;color:#879eb9;margin-top:3px}.perf-details{margin-top:16px;color:#9eb1ca;font-size:11px}.perf-details summary{cursor:pointer;color:#c9dbef}.perf-details p{margin:12px 0;line-height:1.9}.perf-stale .perf-grid,.perf-stale .perf-table-wrap{opacity:.5}.perf-stale #performance-age{color:#ffbd79;font-weight:700}@media(max-width:1200px){.perf-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.performance-panel{padding:15px 12px}.perf-heading{display:block}.perf-heading>span{display:block;margin-bottom:12px}.perf-grid{gap:8px}.perf-card{padding:12px 10px}.perf-card strong{font-size:23px}.perf-heading h2{font-size:19px}}
</style></head>
<body><main>
<header><div><div class="eyebrow">read-only · 北京时间 · 15 秒刷新</div><div class="title">Codex CPA 小时状态</div><div class="muted">中心主账号标记为 7973；状态按账号、代理池和会话分别统计。</div></div><div class="toolbar"><input id="token" type="password" autocomplete="off" placeholder="粘贴只读看板令牌"><button id="save">连接并记住</button><button id="clear" class="alt">清除缓存</button></div></header>
<div class="notice">令牌保存在浏览器本地存储，不写入网址或仓库。页面不会显示管理密钥、客户端 API key、请求体或完整状态头。</div>
<div id="error" class="error"></div><section class="stats"><div class="stat"><span class="muted">账号</span><strong id="n">—</strong></div><div class="stat"><span class="muted">在线</span><strong id="online">—</strong></div><div class="stat"><span class="muted">本小时正常</span><strong id="healthy">—</strong></div><div class="stat"><span class="muted">本小时异常</span><strong id="bad">—</strong></div><div class="stat clock"><span class="muted">北京时间本小时剩余</span><strong id="hourLeft" class="countdown">—</strong></div></section>
<div id="last" class="muted"></div><section id="cards" class="cards"></section>
</main><script>
const API='https://edocf.wznln.com:8443/control/v1',key='cpa_dashboard_token',q=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),state={data:null};
function badge(level,label){return `<span class="badge ${esc(level||'gray')}">${esc(label||'—')}</span>`}
function fmtSec(v){v=Math.max(0,Math.floor(Number(v)||0));let h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return h?`${h}小时${String(m).padStart(2,'0')}分`:m?`${m}分${String(s).padStart(2,'0')}秒`:`${s}秒`}
function fmtBJ(v){if(!v)return '—';return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(v))}
function baseline(x){let level=x.valid&&!x.expired?'green':x.expired?'amber':'gray';let left=x.remaining_seconds!=null?` · 剩余 ${fmtSec(x.remaining_seconds)}`:'';let proxy=x.proxy?` · 出口 ${esc(x.proxy)}`:'';return `<span class="chip">${badge(level,(x.value_length||'—')+' 字节')} ${esc(x.model||'')} ${left}${proxy}</span>`}
function render(d){window.renderPerformance(d);state.data=d;let s=d.summary||{};q('#n').textContent=s.accounts??'—';q('#online').textContent=s.online??'—';q('#healthy').textContent=s.healthy_hours??'—';q('#bad').textContent=s.degraded_hours??'—';q('#last').textContent=`最后更新：${fmtBJ(d.generated_at)}（北京时间）`;q('#cards').innerHTML=(d.accounts||[]).map(a=>{if(!a.ok)return `<article class="account"><div class="account-head"><div class="account-name">${esc(a.label||a.id)}</div>${badge('red','读取失败')}</div><p>${esc(a.error||'无法读取')}</p></article>`;let h=a.hour||{},p=a.probe||{},pool=p.pool||{},vals=p.values||[],sess=a.sessions||[],recs=a.records||[],rn=a.renewal||{};let level=h.status==='healthy'?'green':h.status==='degraded'?'red':'amber',label=h.status==='healthy'?'本小时正常':h.status==='degraded'?'本小时有异常':'本小时暂无业务记录';let active=vals.find(x=>x.valid&&!x.expired)||vals[0];let probeText=p.running?'正在探测':p.next_probe_remaining_seconds!=null?`下一次探测 <span class="countdown" data-next="${esc(p.next_probe_at||'')}" data-kind="probe">${fmtSec(p.next_probe_remaining_seconds)}</span>`:'下一次探测未知';let confirm=rn.active?(rn.confirmation_count>=rn.confirmation_required?`已达到 ${rn.confirmation_count}/${rn.confirmation_required} 次，主动更换待执行`:`正在确认 ${rn.confirmation_count}/${rn.confirmation_required} 次`):'无连续异常';return `<article class="account"><div class="account-head"><div><div class="account-name">${esc(a.label||a.id)}</div><div class="muted">${esc(a.plugin||'CPA')} ${esc(a.version||'')} · 活动账号 ${esc(a.account?.active??'—')}/${esc(a.account?.total??'—')}</div></div>${badge(level,label)}</div><div class="rows"><div class="row"><span>北京时间本小时</span><strong><span class="countdown" data-hour="${esc(h.ends_at||'')}">计算中</span>结束 · ${h.observed??0} 次观测 · 异常 ${h.degraded??0} · 注入 ${h.injected??0}</strong></div><div class="row"><span>扫描倒计时</span><strong>${probeText}<br><span class="muted">服务实际周期 ${fmtSec(p.interval_seconds)}；安全策略周期 ${fmtSec(rn.scheduled_interval_seconds)}</span></strong></div><div class="row"><span>异常处理</span><strong>${confirm}${p.failures?.length?` · 失败记录 ${p.failures.length} 条`:''}</strong></div><div class="row"><span>注入</span><strong>${a.injection?.enabled?'开启':'关闭'} · ${a.injection?.models?.map(esc).join('、')||'—'}</strong></div><div class="row"><span>代理池</span><strong>${pool.total??0} 个 · 活跃 ${pool.active??0} · 禁用 ${pool.disabled??0}</strong></div></div><div class="section"><div class="section-title">当前使用的响应头 / 出口</div><div class="chips">${active?baseline(active):'<span class="empty">暂无有效基线</span>'}</div></div><div class="section"><div class="section-title">代理池探测状态</div><div class="chips">${(pool.entries||[]).length?pool.entries.map(x=>`<span class="chip">${badge(x.disabled?'red':x.last_error?'amber':'green',x.id||'出口')} ${x.active?'当前使用 · ':''}失败 ${x.failures||0}${x.last_error?` · ${esc(x.last_error)}`:''}</span>`).join(''):'<span class="empty">暂无代理池记录</span>'}</div></div><div class="section"><div class="section-title">最近节点探测</div>${(p.checks||[]).length?`<div class="table-wrap"><table class="table"><thead><tr><th>北京时间</th><th>出口</th><th>结果</th><th>响应</th></tr></thead><tbody>${p.checks.slice(0,12).map(x=>{let ok=x.success&&x.observed_model===x.model&&(x.state_length===292||x.state_length===332);return `<tr><td>${fmtBJ(x.time)}</td><td>${esc(x.proxy||'—')}</td><td>${badge(ok?'green':x.success?'amber':'red',x.success?(x.observed_model&&x.observed_model!==x.model?x.observed_model:(x.state_length?x.state_length+' 字节':'已返回')):'失败')}</td><td>${esc(x.duration_ms??'—')} ms${x.error?`<br>${esc(x.error)}`:''}</td></tr>`}).join('')}</tbody></table></div>`:'<span class="empty">暂无节点探测记录</span>'}</div><div class="section"><div class="section-title">会话最近请求</div>${sess.length?`<div class="table-wrap"><table class="table"><thead><tr><th>设备 / 会话</th><th>模型</th><th>状态</th><th>请求 / 失败</th></tr></thead><tbody>${sess.slice(0,12).map(x=>`<tr><td>${esc(x.device||'未归因')}<br><code>${esc(x.session||'unattributed')}</code></td><td>${esc(x.model||'—')}</td><td>${badge(x.level,x.label)}<br>${esc(x.turn_state_length??'—')} 字节</td><td>${esc(x.requests||0)} 次 / 失败 ${esc(x.failures||0)}<br>${esc(x.duration_ms??'—')} ms</td></tr>`).join('')}</tbody></table></div>`:'<span class="empty">暂无会话归因。只有经过中心网关并携带会话标记的请求才会显示。</span>'}</div><div class="section"><div class="section-title">最近业务请求</div>${recs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>北京时间</th><th>请求 → 上游</th><th>结果</th><th>注入</th></tr></thead><tbody>${recs.slice(0,8).map(x=>`<tr><td>${fmtBJ(x.time)}</td><td>${esc(x.requested_model||x.model||'—')} → ${esc(x.upstream_model||'—')}</td><td>${badge(x.classification?.level,x.classification?.label)}</td><td>${esc(x.turn_state_injected_length||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<span class="empty">暂无业务记录</span>'}</div></article>`}).join('')||'<article class="account"><span class="empty">暂无账号数据</span></article>';tick()}
function tick(){let d=state.data;if(!d)return;let end=d.clock?.ends_at;q('#hourLeft').textContent=end?fmtSec((Date.parse(end)-Date.now())/1000):'—';document.querySelectorAll('[data-hour]').forEach(x=>x.textContent=fmtSec((Date.parse(x.dataset.hour)-Date.now())/1000));document.querySelectorAll('[data-next]').forEach(x=>x.textContent=fmtSec((Date.parse(x.dataset.next)-Date.now())/1000))}
async function poll(){let t=localStorage.getItem(key);if(!t){q('#error').textContent='请输入只读看板令牌后连接';return}try{let r=await fetch(API+'/snapshot',{headers:{Authorization:'Bearer '+t},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);q('#error').textContent='';render(await r.json())}catch(e){q('#error').textContent='看板读取失败：'+e.message}}
q('#token').value=localStorage.getItem(key)||'';q('#save').onclick=()=>{let t=q('#token').value.trim();if(t)localStorage.setItem(key,t);poll()};q('#clear').onclick=()=>{localStorage.removeItem(key);q('#token').value='';q('#cards').replaceChildren();document.getElementById('performance-panel')?.remove();poll()};poll();setInterval(poll,15000);setInterval(tick,1000);

// BEGIN PASSIVE PERFORMANCE PANEL
// Shared by the public dashboard and the authenticated account console.
(() => {
  const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const valid = value => typeof value === 'number' && Number.isFinite(value);
  const ms = value => valid(value) ? (value / 1000).toFixed(2) + ' s' : '—';
  const percent = value => valid(value) ? value.toFixed(1) + '%' : '—';
  const size = value => valid(value) ? (value / 1024 ** 3).toFixed(2) + ' GiB' : '—';
  const bj = value => value && Number.isFinite(Date.parse(value)) ? new Date(value).toLocaleTimeString('zh-CN', {timeZone:'Asia/Shanghai', hour12:false}) : '—';
  const graph = (rows, key, color, max) => {
    const points = rows.map((r,i) => valid(r[key]) ? [i, r[key]] : null);
    const ceiling = max || Math.max(1, ...points.filter(Boolean).map(p => p[1]));
    const paths = [];
    let segment = [];
    for (const p of points) {
      if (p) segment.push(`${(p[0] / Math.max(1, rows.length - 1) * 280).toFixed(1)},${(46 - Math.min(1,p[1]/ceiling)*40).toFixed(1)}`);
      else if (segment.length) {paths.push(segment);segment=[];}
    }
    if (segment.length) paths.push(segment);
    return `<svg class="perf-graph" viewBox="0 0 280 50" role="img" aria-label="最近采样趋势"><path d="M0 46H280" stroke="#ffffff16"/>${paths.map(p=>`<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${p.join(' ')}"/>`).join('')}</svg>`;
  };
  const card = (title, value, detail, plot = '') => `<article class="perf-card"><span>${title}</span><strong>${value}</strong><small>${detail}</small>${plot}</article>`;
  let latest = null;
  const freshness = () => {
    const node = document.getElementById('performance-age');
    const root = document.getElementById('performance-panel');
    if (!node || !latest || !root) return;
    const age = (Date.now() - Date.parse(latest.generated_at)) / 1000;
    const stale = !Number.isFinite(age) || age > 60 || age < -60;
    root.classList.toggle('perf-stale', stale);
    node.textContent = stale ? '数据已过期 · 请勿据此判断当前负载' : `北京时间 ${bj(latest.generated_at)} · ${Math.max(0,Math.floor(age))} 秒前`;
  };
  window.renderPerformance = d => {
    let root = document.getElementById('performance-panel');
    if (!root) {
      root = document.createElement('section');
      root.id = 'performance-panel';
      root.className = 'performance-panel';
      root.setAttribute('aria-label','响应速度与中心服务器负载');
      const anchor = document.querySelector('#overview-panel .metrics, main .stats, #cards');
      if (!anchor) return;
      anchor.before(root);
    }
    const p = d.performance;
    latest = p || null;
    if (!p) {root.innerHTML = '<div class="perf-title">响应速度与服务器负载</div><p>等待中心采集数据，暂不能判断性能。</p>'; return;}
    const host = p.host || {}, mem = host.memory || {}, first = p.first_body_ms || {}, total = p.total_ms || {};
    const disk = (host.disks || [])[0], load = host.load_average || [], accounts = d.accounts || [];
    const alerts = [...(host.alerts || [])], missing = host.errors || [];
    if (p.covered_accounts !== p.total_accounts) alerts.push(`测速只覆盖 ${p.covered_accounts ?? 0}/${p.total_accounts ?? 0} 个账号，缺失账号的请求量与在途数暂不可知`);
    const active = valid(p.active_requests) ? String(p.active_requests) : `— <em>已观测 ${p.active_observed ?? 0}</em>`;
    root.innerHTML = `<div class="perf-heading"><div><div class="perf-kicker">LIVE TELEMETRY</div><h2>回复速度与中心负载</h2></div><span id="performance-age"></span></div>
      <div class="perf-alert ${alerts.length ? 'perf-warning' : ''}">${alerts.length ? alerts.map(escape).join('；') : missing.length ? '部分资源指标不可用，暂不能完整判断负载。' : valid(host.cpu_percent) ? '当前资源采样未触发告警阈值' : 'CPU 正在等待第二次采样'}
      <small>每 15 秒采集 · 告警不会自动重启、切换或拒绝请求</small></div>
      <div class="perf-grid">
      ${card('首段响应等待 · P50', ms(first.p50), `P95 ${ms(first.p95)} · 最近 ${ms(first.latest)} · ${first.count ?? 0} 样本`, graph(p.recent || [],'first_body_ms','#91baff'))}
      ${card('完整传输耗时 · P50', ms(total.p50), `P95 ${ms(total.p95)} · 最近 ${ms(total.latest)}`)}
      ${card('在途模型请求', active, `覆盖 ${p.covered_accounts ?? 0}/${p.total_accounts ?? 0} 个账号 · 含等待和传输`)}
      ${card('最近 15 分钟请求', `${p.truncated ? '≥ ' : ''}${p.requests ?? 0}`, `HTTP 2xx 且传输完整 ${p.http_2xx_complete ?? 0} · 失败/中断 ${p.failed ?? 0} · ${percent(p.error_percent)}`)}
      ${card('中心 CPU', percent(host.cpu_percent), `${host.cpu_count ?? '—'} 核 · 负载 1/5/15 分钟 ${load.map(x => x.toFixed(2)).join(' / ') || '—'}`, graph(host.history || [],'cpu_percent','#64dac0',100))}
      ${card('中心内存', percent(mem.used_percent), `可用 ${size(mem.available_bytes)} / 总量 ${size(mem.total_bytes)}`, graph(host.history || [],'memory_percent','#b49cff',100))}
      ${card('系统磁盘', percent(disk?.used_percent), `可用 ${size(disk?.free_bytes)} / 总量 ${size(disk?.total_bytes)}`)}
      ${card('响应头等待 · P50', ms(p.header_ms?.p50), `P95 ${ms(p.header_ms?.p95)} · 不等于首个文字 token`)}
      </div>
      <div class="perf-table-wrap"><table class="perf-table"><thead><tr><th>账号</th><th>在途</th><th>请求 / 失败</th><th>首段 P50 / P95</th><th>完整传输 P50</th><th>最近完成请求 · 北京时间</th></tr></thead><tbody>
      ${accounts.map(a => {const v=a.performance||{};return `<tr><td>${escape(a.label||a.id)}<small>${v.instrumented?'已接入测速':'网关指标未就绪'}</small></td><td>${v.active_requests ?? '—'}</td><td>${v.requests ?? 0} / ${v.failed ?? 0}</td><td>${ms(v.first_body_ms?.p50)} / ${ms(v.first_body_ms?.p95)}</td><td>${ms(v.total_ms?.p50)}</td><td>${bj(v.last_request_at)}</td></tr>`;}).join('')}
      </tbody></table></div>
      <details class="perf-details"><summary>各服务资源与测量说明</summary><div class="perf-table-wrap"><table class="perf-table"><thead><tr><th>服务</th><th>占主机 CPU</th><th>内存 / 服务上限</th><th>上限使用率</th><th>线程/进程数</th></tr></thead><tbody>
      ${(host.services||[]).map(s=>`<tr><td>${escape(s.label)}${s.available?'':' · 未采集'}</td><td>${percent(s.cpu_percent_host)}</td><td>${size(s.memory_bytes)} / ${s.memory_limit_bytes == null ? '未设置或未知' : size(s.memory_limit_bytes)}</td><td>${percent(s.memory_percent)}</td><td>${s.tasks ?? '—'}</td></tr>`).join('')}
      </tbody></table></div><p>测速被动记录经过中心网关的 /v1/responses 业务请求，不额外消耗模型请求。时间从网关完成请求校验后开始；首段可能是协议事件或心跳，并非首个文字 token。完整耗时包含上游生成与向客户端传输，不能直接换算 tokens/s，也不包含客户端到中心的完整往返时间。</p>
      <p>速度分位数只使用最近 15 分钟内 HTTP 2xx 且传输完整的请求；HTTP 成功不证明模型能力。失败、中断和尚未结束的请求分别统计；旧日志缺少计时字段不会补成 0。每账号最多保留 4000 条事件，截断时计数是下限。CPU 首次采样为未知，60 秒未更新将标记过期。</p>
      <p>告警阈值：CPU ≥ 85%、主机或服务内存 ≥ 85%、磁盘 ≥ 90%、每核 1 分钟负载 ≥ 1.5。服务内存来自 cgroup，含缓存与子进程；系统负载不是“会话数”，当前未设置自动限流。</p></details>`;
    freshness();
  };
  setInterval(freshness, 1000);
})();
</script></body></html>
