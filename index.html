<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Codex CPA · 小时状态</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--card:#111f33;--line:#263a55;--muted:#99acc5;--text:#edf5ff;--green:#26d69a;--red:#ff647c;--amber:#f6bd57;--blue:#8bb9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#162b49 0,#08111f 42%);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1280px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.title{font-size:30px;font-weight:800;margin:4px 0}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{width:340px;max-width:70vw;background:#0d192a;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px}.toolbar button{background:#2464c3;border:0;border-radius:9px;color:white;padding:10px 14px;cursor:pointer}.toolbar button.alt{background:#1a2a41}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.account{background:rgba(17,31,51,.92);border:1px solid var(--line);border-radius:14px}.stat{padding:15px}.stat strong{display:block;font-size:25px;margin-top:4px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:16px}.account{padding:18px}.account-head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}.account-name{font-size:20px;font-weight:750}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}.green{background:rgba(38,214,154,.16);color:var(--green)}.red{background:rgba(255,100,124,.16);color:var(--red)}.amber{background:rgba(246,189,87,.16);color:var(--amber)}.gray{background:#223149;color:#bfccdc}.rows{display:grid;gap:7px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed #20334d;padding:5px 0}.row span{color:var(--muted)}.section{margin-top:15px}.section-title{font-weight:700;margin-bottom:7px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#172941;border:1px solid #2b4463;border-radius:8px;padding:5px 8px;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;border-bottom:1px solid #20334d;padding:7px 5px;vertical-align:top}.table th{color:var(--muted);font-weight:600}.table code{color:#b9d2ff}.error{color:var(--red);min-height:24px;margin:12px 0}.notice{border:1px solid #354c6c;background:#101e31;border-radius:12px;padding:12px;margin:14px 0;color:#c2d0e3}.empty{color:var(--muted);font-size:13px}@media(max-width:680px){main{padding:20px 12px}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.toolbar input{width:100%;max-width:100%}header{display:block}.toolbar{margin-top:14px}}
</style></head>
<body><main>
<header><div><div class="eyebrow">read-only · 15 秒刷新</div><div class="title">Codex CPA 小时状态</div><div class="muted">只展示脱敏状态：当前小时是否异常、代理池健康度、有效基线和会话归因。</div></div><div class="toolbar"><input id="token" type="password" autocomplete="off" placeholder="粘贴只读看板令牌"><button id="save">连接</button><button id="clear" class="alt">清除</button></div></header>
<div class="notice">看板令牌只保存在本浏览器当前标签页。页面不会显示管理密钥、客户端 API key、请求体或完整状态头。</div>
<div id="error" class="error"></div><section class="stats"><div class="stat"><span class="muted">账号</span><strong id="n">—</strong></div><div class="stat"><span class="muted">在线</span><strong id="online">—</strong></div><div class="stat"><span class="muted">本小时正常</span><strong id="healthy">—</strong></div><div class="stat"><span class="muted">本小时异常</span><strong id="bad">—</strong></div></section>
<div id="last" class="muted"></div><section id="cards" class="cards"></section>
</main><script>
const API='https://edocf.wznln.com:8443/control/v1',key='cpa_dashboard_token',q=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(level,label){return `<span class="badge ${esc(level||'gray')}">${esc(label||'—')}</span>`}
function baseline(x){let level=x.valid&&!x.expired?'green':x.expired?'amber':'gray';let left=x.remaining_seconds!=null?` · ${Math.max(0,Math.floor(x.remaining_seconds/60))} 分钟` : '';return `<span class="chip">${badge(level,(x.value_length||'—')+' 字节')} ${x.model||''}${left}</span>`}
function render(d){let s=d.summary||{};q('#n').textContent=s.accounts??'—';q('#online').textContent=s.online??'—';q('#healthy').textContent=s.healthy_hours??'—';q('#bad').textContent=s.degraded_hours??'—';q('#last').textContent='最后更新：'+new Date().toLocaleString();q('#cards').innerHTML=(d.accounts||[]).map(a=>{if(!a.ok)return `<article class="account"><div class="account-head"><div class="account-name">${esc(a.label||a.id)}</div>${badge('red','读取失败')}</div><p>${esc(a.error||'无法读取')}</p></article>`;let h=a.hour||{},p=a.probe||{},pool=p.pool||{},vals=p.values||[],sess=a.sessions||[],recs=a.records||[];let level=h.status==='healthy'?'green':h.status==='degraded'?'red':'amber',label=h.status==='healthy'?'本小时正常':h.status==='degraded'?'本小时有异常':'本小时暂无业务记录';return `<article class="account"><div class="account-head"><div><div class="account-name">${esc(a.label||a.id)}</div><div class="muted">${esc(a.plugin||'CPA')} ${esc(a.version||'')} · 活动账号 ${esc(a.account?.active??'—')}/${esc(a.account?.total??'—')}</div></div>${badge(level,label)}</div><div class="rows"><div class="row"><span>本小时</span><strong>观测 ${h.observed??0} · 异常 ${h.degraded??0} · 注入 ${h.injected??0}</strong></div><div class="row"><span>扫描</span><strong>${p.scan_seconds??'—'} 秒周期 · 异常确认 ${p.interval_seconds??'—'} 秒 · TTL ${p.ttl_minutes??'—'} 分钟</strong></div><div class="row"><span>注入</span><strong>${a.injection?.enabled?'开启':'关闭'} · ${a.injection?.models?.map(esc).join('、')||'—'}</strong></div><div class="row"><span>代理池</span><strong>${pool.total??0} 个 · 活跃 ${pool.active??0} · 禁用 ${pool.disabled??0}</strong></div></div><div class="section"><div class="section-title">当前有效基线</div><div class="chips">${vals.length?vals.map(baseline).join(' '):'<span class="empty">暂无有效基线</span>'}</div></div><div class="section"><div class="section-title">代理池最近状态</div><div class="chips">${(pool.entries||[]).length?pool.entries.map(x=>`<span class="chip">${badge(x.disabled?'red':x.last_error?'amber':'green',x.id||'出口')} 失败 ${x.failures||0}</span>`).join(''):'<span class="empty">暂无代理池记录</span>'}</div></div><div class="section"><div class="section-title">会话最近请求</div>${sess.length?`<div class="table-wrap"><table class="table"><thead><tr><th>设备 / 会话</th><th>模型</th><th>状态</th><th>请求</th></tr></thead><tbody>${sess.slice(0,12).map(x=>`<tr><td>${esc(x.device||'未归因')}<br><code>${esc(x.session||'unattributed')}</code></td><td>${esc(x.model||'—')}</td><td>${badge(x.level,x.label)}<br>${esc(x.turn_state_length??'—')} 字节</td><td>${esc(x.requests||0)}<br>${esc(x.duration_ms??'—')} ms</td></tr>`).join('')}</tbody></table></div>`:'<span class="empty">暂无会话归因。只有经过中心网关并携带会话标记的请求才会显示。</span>'}</div><div class="section"><div class="section-title">最近业务请求</div>${recs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>请求 → 上游</th><th>结果</th><th>注入</th></tr></thead><tbody>${recs.slice(0,8).map(x=>`<tr><td>${esc(x.time||'—')}</td><td>${esc(x.requested_model||x.model||'—')} → ${esc(x.upstream_model||'—')}</td><td>${badge(x.classification?.level,x.classification?.label)}</td><td>${esc(x.turn_state_injected_length||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<span class="empty">暂无业务记录</span>'}</div></article>`}).join('')||'<article class="account"><span class="empty">暂无账号数据</span></article>'}
async function poll(){let t=sessionStorage.getItem(key);if(!t){q('#error').textContent='请输入只读看板令牌后连接';return}try{let r=await fetch(API+'/snapshot',{headers:{Authorization:'Bearer '+t},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);q('#error').textContent='';render(await r.json())}catch(e){q('#error').textContent='看板读取失败：'+e.message}}
q('#token').value=sessionStorage.getItem(key)||'';q('#save').onclick=()=>{let t=q('#token').value.trim();if(t)sessionStorage.setItem(key,t);poll()};q('#clear').onclick=()=>{sessionStorage.removeItem(key);q('#token').value='';q('#cards').replaceChildren();poll()};poll();setInterval(poll,15000);
</script></body></html>
